name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        run: pytest

  # Proves the repository reproduces its own artefacts: the simulation half of
  # the pipeline is deterministic under a fixed seed, so regenerating it must
  # leave no diff against what is committed.
  reproduce:
    name: Reproducibility check
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Regenerate simulation sweep
        run: python -c "
          import sys; sys.path.insert(0, 'src')
          from netlab.sim import sweep_csma_cd
          r = sweep_csma_cd([2, 8, 32], repeats=3, n_slots=100000)
          for n in sorted(r):
              u, _ = r[n]['util']
              c, _ = r[n]['cr']
              print(f'N={n:<3} util={u*100:6.2f}%  collision={c*100:6.3f}%')
          assert abs(r[2]['resid']) < 1e-2, 'slot accounting drifted'
          print('OK: slot budget reconciles to <1e-2')
          "
