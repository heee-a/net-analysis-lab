name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Enable Pages on first run. GitHub does not switch Pages on when a deploy
      # workflow is added, so an unattended repository would 404 forever. The
      # request is idempotent: 409 means the site already exists.
      - name: Ensure GitHub Pages is enabled
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          status=$(curl -s -o pages.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/pages" \
            -d '{"build_type":"workflow"}')
          echo "enable-pages -> HTTP ${status}"
          cat pages.json
          case "${status}" in
            201|204|409) echo "Pages is configured for this repository." ;;
            *) echo "::warning::Could not enable Pages automatically (HTTP ${status}). Enable it once at Settings -> Pages -> Source: GitHub Actions, then re-run this workflow." ;;
          esac

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
